<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanyaMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6;
            --primary-hover: #a78bfa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background: var(--bg-grad);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            font-size: 32px;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(to right, #c084fc, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
            transition: color 0.3s;
        }
        
        .form-group:focus-within label {
            color: var(--primary-hover);
        }

        .form-group input { 
            width: 100%; 
            padding: 14px 16px; 
            box-sizing: border-box; 
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            background: rgba(0,0,0,0.4);
        }

        .btn { 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px;
            cursor: pointer; 
            width: 100%; 
            font-size: 16px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            transition: background 0.3s ease, transform 0.15s ease, box-shadow 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        }
        
        .btn:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }
        
        .btn:active { 
            transform: translateY(1px); 
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.4);
        }

        .message { 
            padding: 14px; 
            margin-bottom: 24px; 
            border-radius: 12px; 
            display: none; 
            font-size: 14px; 
            font-weight: 400;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.error { 
            background-color: rgba(239, 68, 68, 0.15); 
            color: #fca5a5; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
        }
        
        .message.success { 
            background-color: rgba(16, 185, 129, 0.15); 
            color: #6ee7b7; 
            border: 1px solid rgba(16, 185, 129, 0.3); 
        }
        
        .toggle-link { text-align: center; margin-top: 25px; font-size: 14px; }
        .toggle-link a { 
            color: var(--text-muted); 
            text-decoration: none; 
            cursor: pointer; 
            transition: color 0.3s ease; 
            border-bottom: 1px solid transparent;
        }
        .toggle-link a:hover { 
            color: var(--text-main); 
            border-bottom-color: var(--text-main);
        }

        /* Ambient background glow */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <div id="messageBox" class="message"></div>

        <div id="loginForm" style="display: none;">
            <h2>Welcome Back</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 15px; line-height: 1.5;">
                Registration successful.<br>
                Please use the console terminal to login to KanyaMart.
            </p>
            <div class="toggle-link">
                <a onclick="showForm('register')">Register a new account</a>
            </div>
        </div>

        <div id="registerForm">
            <h2>KanyaMart</h2>
            <div class="form-group">
                <label for="regUsername">Username</label>
                <input type="text" id="regUsername" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" required placeholder="••••••••">
            </div>
            <button class="btn" onclick="register()">Register</button>
            <div class="toggle-link">
                <a onclick="showForm('login')">Already have an account? Login here</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        showForm('register');
    </script>
</body>
</html>
